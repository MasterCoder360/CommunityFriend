<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CommunityFriend</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
        <nav>
            <button class="logo" onclick="window.location.href='index.html'">CommunityFriend</button>
            <ul class="navlinks">
                <li><a href="home.html" title="about me">Home</a></li>
                <li><a href="event.html" title="my hobbies">Events</a></li>
                <li><a href="service.html" title="my projects">Services</a></li>
            </ul>
            <div class="btns">
                <button class="btn" onclick="window.location.href='contact.html'">Contact Me</button>
            </div>
        </nav>
    </header>
    <script>
    window.addEventListener('load', () => { 
        const element1 = document.getElementById('typewriter-text'); 
        if (element1) { 
            const text1 = "This is a beta-version release and it is only available exclusively across Jersey City, New Jersey Events. We are working hard behind the scenes to make new features happen! This project is mainly about getting updates on special events happening around Jersey City so you don't miss out on any important dates. It can also help mark events to put in your calendar and if you don't, that's okay because the website organizes the events for you."; 
            let index1 = 0; 
            const cursor = element1.querySelector('.cursor');

            function run1() { 
                if (index1 < text1.length) { 
                    const textNode = document.createTextNode(text1.charAt(index1)); 
                    element1.insertBefore(textNode, cursor); 
                    index1++; 
                    setTimeout(run1, 30); 
                } 
            } 
            run1(); 
        } 
    });
</script>
</body>

    <main class="glass-box">
    <h1 class="digital-display">What is this?</h1>
    <h2>This is a website where you can look at upcoming events in NJ, Jersey City</h2>
     <div class="bio-container">
       <p id="typewriter-text"><span class="cursor">|</span></p>
     </div>
    </main>
    </html>
